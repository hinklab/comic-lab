name: Regression & Quality Gates CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Python Regression & Quality Gates Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: "https://mock.supabase.co"
      SUPABASE_KEY: "mock-key"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run Master Pipeline Regression Suite
        run: |
          python -m unittest tests/test_regressions.py

      - name: Run Supabase & Cloud Enhancements Tests
        run: |
          python -m unittest test_supabase_migration.py test_cloud_enhancements.py

      - name: Run Complete Test Suite
        run: |
          python -m unittest test_quality_gates.py test_reading_order.py test_rules_and_sfx.py test_conjoined_and_docked_bubbles.py test_universal_conjoined_bubbles.py test_memory_and_terminology.py test_character_profiles.py test_bubble_mask_editor.py test_spectral_conjoined_bubbles.py test_history_manager.py
